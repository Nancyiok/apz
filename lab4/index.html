<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Анастасія Курдюкова</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --sky-top: #e8f6fb;
    --sky-bottom: #bfe6f2;
    --ink: #0b3a53;
    --ink-soft: #4f7f95;
    --wave-1: rgba(56, 170, 210, .35);
    --wave-2: rgba(30, 140, 190, .45);
    --wave-3: rgba(14, 110, 165, .65);
    --wave-4: #0a5c8c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --sky-top: #04121c;
      --sky-bottom: #0a2a3d;
      --ink: #e4f5fb;
      --ink-soft: #7fb3c8;
      --wave-1: rgba(40, 140, 190, .18);
      --wave-2: rgba(30, 120, 170, .28);
      --wave-3: rgba(20, 95, 145, .45);
      --wave-4: #0b4566;
    }
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { -webkit-font-smoothing: antialiased; }

  body {
    position: relative;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 100%);
    color: var(--ink);
    font-family: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  main {
    position: relative;
    z-index: 2;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 8vh clamp(16px, 6vw, 96px) 26vh;
    max-width: 1200px;
  }

  h1 {
    font-size: clamp(42px, 9vw, 120px);
    font-weight: 700;
    line-height: .98;
    letter-spacing: -.04em;
    animation: up 1s .2s cubic-bezier(.16, 1, .3, 1) both;
  }
  h1 span {
    display: block;
    font-weight: 300;
    color: var(--ink-soft);
  }

  .group {
    margin-top: clamp(24px, 4vw, 40px);
    font-size: clamp(16px, 2vw, 19px);
    color: var(--ink-soft);
    animation: up 1s .35s cubic-bezier(.16, 1, .3, 1) both;
  }
  .group b { color: var(--ink); font-weight: 600; }

  @keyframes up {
    from { opacity: 0; transform: translateY(24px); }
  }

  /* хвилі */
  .waves {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100%;
    height: clamp(140px, 28vh, 280px);
    z-index: 1;
  }
  .waves use { animation: drift 22s cubic-bezier(.55, .5, .45, .5) infinite; }
  .waves use:nth-child(1) { fill: var(--wave-1); animation-delay: -2s;  animation-duration: 9s; }
  .waves use:nth-child(2) { fill: var(--wave-2); animation-delay: -3s;  animation-duration: 12s; }
  .waves use:nth-child(3) { fill: var(--wave-3); animation-delay: -4s;  animation-duration: 15s; }
  .waves use:nth-child(4) { fill: var(--wave-4); animation-delay: -5s;  animation-duration: 22s; }
  @keyframes drift {
    from { transform: translate3d(-90px, 0, 0); }
    to   { transform: translate3d(85px, 0, 0); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
  }
</style>
</head>
<body>
  <main>
    <h1>Курдюкова <span>Анастасія Романівна</span></h1>
    <p class="group">Група <b>122-23-1</b></p>
  </main>

  <svg class="waves" viewBox="0 24 150 28" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <path id="wave" d="M-160 44c30 0 58-18 88-18s58 18 88 18 58-18 88-18 58 18 88 18v44h-352z"/>
    </defs>
    <use href="#wave" x="48" y="0"/>
    <use href="#wave" x="48" y="3"/>
    <use href="#wave" x="48" y="5"/>
    <use href="#wave" x="48" y="7"/>
  </svg>
</body>
</html>
